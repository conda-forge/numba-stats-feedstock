schema_version: 1

context:
  name: numba-stats
  version: "1.14.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 70a6ccebfca1c9b6173db5700e2c5532fe4132f29f6e6e7ffe26296340cd57c6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - numba >=0.50
    - python >=${{ python_min }}
    - scipy >=1.5.0
    - numpy
    - importlib-metadata

tests:
  - python:
      imports:
        - numba_stats
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: Fast numba-accelerated versions of common statistical functions
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/numba-stats/

extra:
  recipe-maintainers:
    - ikrommyd
    - conda-forge/scikit-hep
    - chrisburr
